[program:$SERVICE]
command=/opt/djevops/bin/with-bashrc.sh /bin/bash -c $COMMAND
directory=/srv/app
user=$USER
stdout_logfile=/var/log/$SERVICE.log
stderr_logfile=/var/log/$SERVICE.log
autostart=true
autorestart=true
startsecs=1
stopwaitsecs=600
; Escalate SIGKILL to the whole process group so no child (e.g. a forked worker)
; is orphaned and left holding resources across a restart.
killasgroup=true

; Disable log file rotation - We use logrotate for this.
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
stdout_logfile_backups=0
stderr_logfile_backups=0
