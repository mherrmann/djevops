[project]
name = "djevops"
version = "0.1.0"
description = "Host Django without Docker"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Michael Herrmann"}]
dependencies = ["PyYAML==6.0.3"]

[project.scripts]
djevops = "djevops.__main__:main"

[project.urls]
Homepage = "https://github.com/mherrmann/djevops"
Repository = "https://github.com/mherrmann/djevops"

[project.optional-dependencies]
test = [
    "boto3",
    "celery==5.5.3",
    "django==5.1.2",
    "dnsimple==2.15.0",
    "hcloud==2.13.0",
    "requests==2.32.5",
    "tomli-w==1.2.0",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["djevops*"]

[tool.setuptools.package-data]
djevops = ["bin/*", "conf/**/*", "conf/.*", "pyproject.toml", "uv.lock"]
