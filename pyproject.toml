[project]
name = "djevops"
version = "0.0.1"
description = "Host Django without Docker"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML==6.0.3"]

[project.optional-dependencies]
test = [
    "celery==5.5.3",
    "django==5.1.2",
    "dnsimple==2.15.0",
    "hcloud==2.13.0",
    "requests==2.32.5",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["djevops*"]
