[program:beat]
command=/opt/djevops/bin/with-bashrc.sh celery -A core beat -s /var/run/django/beat-schedule --pidfile /var/run/django/beat.pid -l INFO
directory=/srv/app
user=django
stdout_logfile=/var/log/beat.log
stderr_logfile=/var/log/beat.log
autostart=true
autorestart=true
startsecs=10

; Disable log file rotation - We use logrotate for this.
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
stdout_logfile_backups=0
stderr_logfile_backups=0
